plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    unitTest {
        enable()
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'iaftfc.gametest.report', file('build/test-results/gametest/TEST-iaftfc.xml').getAbsolutePath()
        }

        gameTestFixture {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest-persistence')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'iaftfc_fixture'
            systemProperty 'iaftfc.gametest.report', file('build/test-results/gametest/TEST-iaftfc-fixture.xml').getAbsolutePath()
            systemProperty 'iaftfc.gametest.fixture', file('run/gametest-persistence/fixture-pos.txt').getAbsolutePath()
        }

        gameTestVerify {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest-persistence')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'iaftfc_verify'
            systemProperty 'iaftfc.gametest.report', file('build/test-results/gametest/TEST-iaftfc-persistence.xml').getAbsolutePath()
            systemProperty 'iaftfc.gametest.fixture', file('run/gametest-persistence/fixture-pos.txt').getAbsolutePath()
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'tfc'
        }

        dataFirst {
            data()
            gameDirectory = project.file('build/run-data-first')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('build/datagen-repro/first').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'tfc'
        }

        dataSecond {
            data()
            gameDirectory = project.file('build/run-data-second')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('build/datagen-repro/second').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'tfc'
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        iaftfc_test {
            sourceSet(sourceSets.test)
        }
    }
}

tasks.register('cleanGameTestPersistence', Delete) {
    delete layout.projectDirectory.dir('run/gametest-persistence')
}
tasks.named('runGameTestFixture').configure {
    dependsOn 'cleanGameTestPersistence'
}
tasks.named('runGameTestVerify').configure {
    dependsOn 'runGameTestFixture'
}
tasks.named('runGameTestServer').configure {
    dependsOn 'verifyDataReproducibility'
}

tasks.register('verifyDeterministicOutputs') {
    group = 'verification'
    dependsOn 'runGameTestVerify'
    def root = project.projectDir
    doLast {
        def directory = new File(root, 'run/gametest-persistence')
        def first = new File(directory, 'draws-fixture.txt')
        def second = new File(directory, 'draws-verify.txt')
        def report = new File(root, 'build/test-results/gametest/TEST-iaftfc-draws.xml')
        def success = first.isFile() && second.isFile() && java.util.Arrays.equals(first.bytes, second.bytes)
        report.parentFile.mkdirs()
        report.setText('<testsuite tests="1" failures="' + (success ? '0' : '1')
            + '"><testcase classname="iaftfc:draws" name="reproducible">'
            + (success ? '' : '<failure message="Loot or worldgen selection differed after restart"/>')
            + '</testcase></testsuite>\n', 'UTF-8')
        if (!success) throw new GradleException('Loot or worldgen selection differed after restart')
    }
}

tasks.register('verifyDataReproducibility') {
    group = 'verification'
    dependsOn 'runDataFirst', 'runDataSecond'
    def root = project.projectDir
    doLast {
        def first = new File(root, 'build/datagen-repro/first')
        def second = new File(root, 'build/datagen-repro/second')
        def generated = new File(root, 'src/generated/resources')
        def report = new File(root, 'build/test-results/gametest/TEST-iaftfc-datagen.xml')
        def failure = null
        try {
            def paths = { directory ->
                def files = java.nio.file.Files.walk(directory.toPath())
                try {
                    files.filter { java.nio.file.Files.isRegularFile(it) && it.toString().endsWith('.json') }
                        .map { directory.toPath().relativize(it).toString().replace('\\', '/') }
                        .collect(java.util.stream.Collectors.toSet())
                } finally {
                    files.close()
                }
            }
            def expected = paths(generated)
            if (expected.isEmpty() || paths(first) != expected || paths(second) != expected) {
                throw new GradleException('Generated JSON paths differ between both runs and src/generated/resources')
            }
            expected.each { path ->
                def bytes = new File(first, path).bytes
                if (!java.util.Arrays.equals(bytes, new File(second, path).bytes)
                    || !java.util.Arrays.equals(bytes, new File(generated, path).bytes)) {
                    throw new GradleException("Generated JSON differs: ${path}")
                }
            }
        } catch (Exception exception) {
            failure = exception.message
        }
        report.parentFile.mkdirs()
        def result = failure == null ? '' : '<failure message="' + failure.replace('&', '&amp;').replace('"', '&quot;').replace('<', '&lt;') + '"/>'
        report.setText('<testsuite tests="1" failures="' + (failure == null ? '0' : '1')
            + '"><testcase classname="iaftfc:datagen" name="reproducible">' + result
            + '</testcase></testsuite>\n', 'UTF-8')
        if (failure != null) throw new GradleException(failure)
    }
}

tasks.named('runGameTestServer').configure {
    finalizedBy 'verifyAcceptanceCoverage'
}

tasks.register('verifyAcceptanceCoverage') {
    group = 'verification'
    def root = project.projectDir
    doLast {
        def report = new File(root, 'build/test-results/gametest/TEST-iaftfc-acceptance.xml')
        def failure = null
        try {
            def map = new groovy.json.JsonSlurper().parse(new File(root, 'tests/acceptance.json'))
            def spec = new File(root, 'PROJECT.md').text
            def ids = (spec =~ /##### (AC-F\d{3}-\d{3})/).collect { it[1] }.toSet()
            def mapped = (map.gameTests.collect { it.acId } + map.e2e.collect { it.acId }).toSet()
            if (!ids.containsAll(mapped)) throw new GradleException("Unknown acceptance IDs: ${mapped - ids}")
            map.e2e.each { entry ->
                def scenario = new File(root, entry.scenario)
                if (!scenario.isFile() || !scenario.text.contains("screenshot(client, '${entry.acId}'")) {
                    throw new GradleException("Missing screenshot for ${entry.acId}: ${entry.scenario}")
                }
            }
            def parsed = [:]
            map.gameTests.each { entry ->
                if (!parsed.containsKey(entry.report)) {
                    def xml = new File(root, entry.report)
                    if (!xml.isFile()) throw new GradleException("Missing GameTest report: ${entry.report}")
                    parsed[entry.report] = new groovy.xml.XmlSlurper().parse(xml)
                }
                def cases = parsed[entry.report].depthFirst().findAll {
                    it.name() == 'testcase' && it.@classname.text() == entry.classname && it.@name.text() == entry.name
                }
                if (cases.size() != 1 || cases[0].failure.size() || cases[0].error.size() || cases[0].skipped.size()) {
                    throw new GradleException("GameTest missing or unsuccessful: ${entry.acId} ${entry.name}")
                }
            }
            parsed.values().each { xml ->
                if (xml.depthFirst().any { it.name() == 'skipped' }) {
                    throw new GradleException('A GameTest was skipped')
                }
            }
            def resources = new File(root, 'src/generated/resources/assets/iaftfc')
            new File(root, 'src/generated/resources').eachFileRecurse { resource ->
                if (resource.isFile() && resource.name.endsWith('.json')) {
                    new groovy.json.JsonSlurper().parse(resource)
                }
            }
            def english = new groovy.json.JsonSlurper().parse(new File(resources, 'lang/en_us.json'))
            if (english.isEmpty()) throw new GradleException('English translations are empty')
            def models = new File(resources, 'models')
            if (models.isDirectory()) {
                models.eachFileRecurse { model ->
                    if (model.isFile() && model.name.endsWith('.json')) {
                        def data = new groovy.json.JsonSlurper().parse(model)
                        data.textures?.values()?.each { texture ->
                            if (texture instanceof String && texture.startsWith('iaftfc:')) {
                                def png = new File(resources, 'textures/' + texture.substring(7) + '.png')
                                def mainPng = new File(root, 'src/main/resources/assets/iaftfc/textures/' + texture.substring(7) + '.png')
                                if (!png.isFile() && !mainPng.isFile()) {
                                    throw new GradleException("Missing texture: ${texture}")
                                }
                            }
                        }
                    }
                }
            }
        } catch (Exception exception) {
            failure = exception.message
        }
        report.parentFile.mkdirs()
        def result = failure == null ? '' : '<failure message="' + failure.replace('&', '&amp;').replace('"', '&quot;').replace('<', '&lt;') + '"/>'
        report.setText('<testsuite tests="1" failures="' + (failure == null ? '0' : '1')
            + '"><testcase classname="iaftfc:acceptance" name="allcriteria">' + result
            + '</testcase></testsuite>\n', 'UTF-8')
        if (failure != null) throw new GradleException(failure)
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "maven.modrinth:terrafirmacraft:${tfc_version}"
    compileOnly "curse.maven:iceandfire-ce-1040076:${iceandfire_file_id}"
    compileOnly "curse.maven:jupiter-1072905:${jupiter_file_id}"
    compileOnly "curse.maven:uranus-1010827:${uranus_file_id}"
    testCompileOnly "maven.modrinth:terrafirmacraft:${tfc_version}"
    testCompileOnly "curse.maven:iceandfire-ce-1040076:${iceandfire_file_id}"
    testCompileOnly "curse.maven:jupiter-1072905:${jupiter_file_id}"
    testCompileOnly "curse.maven:uranus-1010827:${uranus_file_id}"
    localRuntime "maven.modrinth:terrafirmacraft:${tfc_version}"
    localRuntime "curse.maven:iceandfire-ce-1040076:${iceandfire_file_id}"
    localRuntime "curse.maven:jupiter-1072905:${jupiter_file_id}"
    localRuntime "curse.maven:uranus-1010827:${uranus_file_id}"
    localRuntime "maven.modrinth:patchouli:${patchouli_version}"
    localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            tfc_version            : tfc_version,
            iceandfire_version     : iceandfire_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
